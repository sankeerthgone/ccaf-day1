<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .globe-fill { fill: #3b82f6; }
      .land-fill { fill: #10b981; }
      .water-fill { fill: #0ea5e9; }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" class="globe-fill" opacity="0.2"/>

  <!-- Water -->
  <circle cx="50" cy="50" r="45" class="water-fill"/>

  <!-- Simple continents representation -->
  <!-- North America -->
  <ellipse cx="25" cy="35" rx="8" ry="10" class="land-fill"/>

  <!-- South America -->
  <ellipse cx="30" cy="55" rx="6" ry="12" class="land-fill"/>

  <!-- Europe/Africa -->
  <ellipse cx="50" cy="40" rx="7" ry="9" class="land-fill"/>
  <ellipse cx="55" cy="55" rx="5" ry="12" class="land-fill"/>

  <!-- Asia -->
  <ellipse cx="70" cy="45" rx="12" ry="10" class="land-fill"/>

  <!-- Australia -->
  <ellipse cx="75" cy="65" rx="5" ry="6" class="land-fill"/>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#3b82f6" stroke-width="2"/>
</svg>
